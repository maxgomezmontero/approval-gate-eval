name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync pytest -q
      - name: Rebuild the results table from the committed logs (no API calls)
        run: uv run --no-sync python -m approval_gate.report > /dev/null && git diff --stat --exit-code results/summary.csv
